$kind: http-request
description: Second pending school, used to demo the REJECT flow. Test script saves `rejectInstituteId`.
url: "{{baseUrl}}/auth/admin-request"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Demo Admin Two",
      "email": "reject.admin@lakeview-school.in",
      "password": "Demo@1234",
      "schoolName": "Lakeview International School",
      "address": "Lake Road, Udaipur",
      "phone": "9812345678"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.ok && json.data && json.data.instituteId) {
          pm.collectionVariables.set('rejectInstituteId', json.data.instituteId);
          console.log('Saved rejectInstituteId:', json.data.instituteId);
      }
    language: text/javascript
order: 2000
