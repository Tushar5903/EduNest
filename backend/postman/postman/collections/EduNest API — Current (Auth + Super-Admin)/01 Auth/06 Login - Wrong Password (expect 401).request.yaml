$kind: http-request
description: "Negative test: valid identifier + wrong password → 401 'Invalid credentials' (generic, no user enumeration)."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-Client: console
body:
  type: json
  content: |-
    {
      "identifier": "{{superEmail}}",
      "password": "WrongPassword123!"
    }
order: 6000
